name: ArchitectMentor publication gates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: architectmentor-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  editorial-quality:
    name: editorial-quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check editorial quality of new PL/EN articles
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/am-editorial-gate.mjs --changed
      - name: Test editorial preflight rules
        run: node --test tests/am-editorial-gate.test.mjs
      - name: Validate publishing workflow syntax
        run: node --check scripts/am-desk-publisher.mjs
      - name: Test protected Cloudflare Preview rules
        run: node --test tests/am-cloudflare-preview.test.mjs
      - name: Test release correction safety guards
        run: node --test tests/am-release-correction.test.mjs
      - name: Test required CI-before-ready release order
        run: node --test tests/am-release-ci-order.test.mjs
      - run: npm run test:comments
      - name: Verify PL/EN exercise content and mentor contracts
        run: node --test tests/exercises.test.cjs
      - name: Build public PL/EN pages
        run: PUBLIC_SITE_INDEXABLE=true npm run build
      - name: Verify latest bilingual practice, routes, RSS and sitemap
        run: node scripts/check-editorial-publishing.mjs

  protected-preview:
    name: protected-preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: editorial-quality
    if: github.event_name == 'pull_request'
    steps:
      - name: Require a PR from the connected repository
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" || { echo 'Protected Preview requires an in-repository branch'; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify protected Cloudflare Pages PL/EN Preview and RSS
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_READ_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_READ_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: bash scripts/verify-protected-preview.sh
