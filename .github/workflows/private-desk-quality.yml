name: Private Desk quality
on:
  pull_request:
    paths:
      - "desk/**"
      - "radar/lh/public/**"
      - "radar/db/002_architectmentor_editorial_audit.sql"
      - ".github/workflows/private-desk-quality.yml"
  workflow_dispatch:
jobs:
  desk-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit
      - run: npm run typecheck
      - name: Build with synthetic, non-functional auth keys
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_synthetic_key_for_build_only_000000000000
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -l radar/lh/public/index.php
      - run: php -l radar/lh/public/editorial.php
