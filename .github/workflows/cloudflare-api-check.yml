name: ArchitectMentor Cloudflare API compatibility

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'api/**'
      - '.node-version'
      - 'public/**'
      - 'scripts/cloudflare-static-preflight.mjs'
      - 'tests/cloudflare-api-adapter.test.mjs'
      - '.github/workflows/cloudflare-api-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-functions:
    name: Cloudflare Pages bundle and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify Cloudflare adapter HTTP contracts
        run: node --test tests/cloudflare-api-adapter.test.mjs
      - name: Build and verify the Cloudflare Pages static output
        run: npm run build && node scripts/cloudflare-static-preflight.mjs
      # Keep this in sync with the Wrangler version reported by Cloudflare Pages Git builds.
      - name: Bundle Functions with the Cloudflare Pages Git builder version
        run: npx --yes wrangler@3.114.17 pages functions build --compatibility-date 2026-11-20 --compatibility-flag nodejs_compat --outdir .cloudflare/bundle
      - name: Smoke-test real local Cloudflare Pages runtime (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages dev dist --compatibility-date 2026-11-20 --compatibility-flag nodejs_compat --port 8788 > /tmp/am-cloudflare-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            code=$(curl -s -o /tmp/am-health.json -w '%{http_code}' --max-time 2 http://127.0.0.1:8788/api/health || true)
            if [ "$code" = 503 ]; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo 'Cloudflare Pages readiness route failed'
            tail -n 45 /tmp/am-cloudflare-pages.log
            exit 1
          fi
          grep -q '"status":"degraded"' /tmp/am-health.json
          for endpoint in generate evaluate-puzzle; do
            code=$(curl -s -o /tmp/am-method.json -w '%{http_code}' --max-time 5 "http://127.0.0.1:8788/api/$endpoint")
            if [ "$code" != 405 ]; then
              echo "Wrong API status for $endpoint: $code"
              exit 1
            fi
          done
          echo 'Cloudflare Pages runtime routes responded as expected.'
